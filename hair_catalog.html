<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hair Extensions Catalog | HE Global Ascent</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --text: #1c1917;
      --dark: #181512;
      --line: #e7dfd5;
      --gold: #c9a66b;
      --muted: #6b625b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
    
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 28px; letter-spacing: -0.03em; margin-bottom: 15px; }
    .header a { color: var(--muted); text-decoration: none; font-size: 14px; border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; display: inline-block; transition: 0.2s; }
    .header a:hover { background: var(--dark); color: #fff; }
    
    .slider-container { max-width: 1080px; margin: 0 auto; position: relative; }
    .slider { 
      position: relative; 
      width: 100%; 
      height: 85vh; 
      min-height: 650px; 
      background: #fff; 
      border: 1px solid var(--line); 
      border-radius: 16px; 
      overflow: hidden; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 18px 45px rgba(28, 25, 23, 0.05); 
    }
    
    .slide { display: none; max-width: 100%; max-height: 100%; object-fit: contain; }
    .slide.active { display: block; animation: fade 0.4s ease-in-out; }
    @keyframes fade { from { opacity: 0.3; } to { opacity: 1; } }

    .nav-arrows { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; transform: translateY(-50%); padding: 0 15px; pointer-events: none; }
    .arrow-btn { pointer-events: auto; background: var(--dark); color: #fff; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; opacity: 0.6; }
    .arrow-btn:hover { opacity: 1; transform: scale(1.1); }

    .nav-dots { 
      display: grid; 
      grid-template-columns: repeat(18, 1fr); 
      gap: 10px 5px; 
      margin-top: 30px; 
      max-width: 1080px; 
      margin-left: auto; 
      margin-right: auto; 
      text-align: center;
    }
    
    .dot-btn { 
      background: none; 
      border: none; 
      color: var(--muted); 
      cursor: pointer; 
      font-size: 16px; 
      font-weight: 500; 
      padding: 5px 0;
      transition: 0.2s;
      position: relative;
    }
    
    .dot-btn.active { 
      color: var(--dark); 
      font-weight: 800; 
      transform: scale(1.2);
    }
    .dot-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--gold);
    }
    .dot-btn:hover:not(.active) { color: var(--gold); }

    @media (max-width: 900px) {
      .nav-dots { grid-template-columns: repeat(9, 1fr); }
      .slider { height: 60vh; min-height: 400px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Hair Extensions Catalog</h1>
    <a href="index.html">← Back to Main Website</a>
  </div>

  <div class="slider-container">
    <div class="slider" id="slider">
    </div>
    
    <div class="nav-arrows">
      <button class="arrow-btn" onclick="changeSlide(-1)" aria-label="Previous">❮</button>
      <button class="arrow-btn" onclick="changeSlide(1)" aria-label="Next">❯</button>
    </div>
  </div>

  <div class="nav-dots" id="nav-dots">
  </div>

  <script>
    const totalPages = 36;
    const slider = document.getElementById('slider');
    const dotsContainer = document.getElementById('nav-dots');
    let currentIndex = 1;

    function initSlider() {
      for (let i = 1; i <= totalPages; i++) {
        const img = document.createElement('img');
        img.src = `hair_images/p${i}.jpg`;
        img.className = 'slide';
        img.id = `slide-${i}`;
        img.alt = `Hair Catalog Page ${i}`;
        img.onerror = function() { this.src = `https://via.placeholder.com/1000x800?text=Page+${i}+Missing`; };
        if (i === 1) img.classList.add('active');
        slider.appendChild(img);

        const btn = document.createElement('button');
        btn.className = 'dot-btn';
        if (i === 1) btn.classList.add('active');
        btn.textContent = i;
        btn.onclick = () => goToSlide(i);
        dotsContainer.appendChild(btn);
      }
    }

    function goToSlide(index) {
      document.querySelectorAll('.slide').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.dot-btn').forEach(el => el.classList.remove('active'));
      
      const targetSlide = document.getElementById(`slide-${index}`);
      if (targetSlide) targetSlide.classList.add('active');
      dotsContainer.children[index - 1].classList.add('active');
      currentIndex = index;
    }

    function changeSlide(direction) {
      let newIndex = currentIndex + direction;
      if (newIndex > totalPages) newIndex = 1;
      if (newIndex < 1) newIndex = totalPages;
      goToSlide(newIndex);
    }

    initSlider();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });
  </script>
</body>
</html>
