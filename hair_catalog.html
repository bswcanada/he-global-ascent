<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hair Extensions Catalog | HE Global Ascent</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --text: #1c1917;
      --dark: #181512;
      --line: #e7dfd5;
      --gold: #c9a66b;
      --muted: #6b625b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 40px 20px; }
    a { color: inherit; text-decoration: none; }
    
    .container { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .site-header { background: rgba(247, 244, 239, 0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding: 16px 0; position: sticky; top: 0; z-index: 20; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    .brand-name { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 16px; }
    .back-link { font-size: 14px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .back-link:hover { color: var(--dark); }

    .page-header { padding: 60px 0 40px; text-align: center; }
    .page-title { font-size: clamp(32px, 5vw, 48px); letter-spacing: -0.04em; margin-bottom: 16px; }
    .page-desc { color: var(--muted); font-size: 16px; max-width: 600px; margin: 0 auto; }

    .slider-container { max-width: 1080px; margin: 0 auto; position: relative; } 
    .slider { 
      position: relative; 
      width: 100%; 
      height: 85vh; 
      min-height: 650px; 
      background: #fff; 
      border: 1px solid var(--line); 
      border-radius: 16px; 
      overflow: hidden; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 18px 45px rgba(28, 25, 23, 0.05); 
    }
    
    .slide { display: none; max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
    .slide.active { display: block; animation: fade 0.4s ease-in-out; }
    @keyframes fade { from { opacity: 0.3; } to { opacity: 1; } }

    .nav-arrows { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; transform: translateY(-50%); padding: 0 15px; pointer-events: none; }
    .arrow-btn { pointer-events: auto; background: var(--dark); color: #fff; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; opacity: 0.6; }
    .arrow-btn:hover { opacity: 1; transform: scale(1.1); }

    .nav-dots { 
      display: grid; 
      grid-template-columns: repeat(18, 1fr); 
      gap: 10px 5px; 
      margin-top: 30px;
      margin-bottom: 60px;
      max-width: 1080px; 
      margin-left: auto; 
      margin-right: auto; 
      text-align: center;
    }
    
    .dot-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; font-weight: 500; padding: 5px 0; transition: 0.2s; position: relative; }
    .dot-btn.active { color: var(--dark); font-weight: 800; transform: scale(1.2); }
    .dot-btn.active::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 2px; background: var(--gold); }
    .dot-btn:hover:not(.active) { color: var(--gold); }

    .footer { padding: 40px 0; text-align: center; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

    /* 모달(팝업) 스타일 및 모달 내 화살표 추가 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal.show { display: flex; opacity: 1; }
    .modal-content { max-width: 85vw; max-height: 85vh; object-fit: contain; border-radius: 8px; transform: scale(0.95); transition: transform 0.3s ease; z-index: 1001; }
    .modal.show .modal-content { transform: scale(1); }
    
    .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: none; border: none; z-index: 1005; transition: color 0.2s; }
    .close-btn:hover { color: var(--gold); }

    /* 모달 전용 이동 화살표 */
    .modal-nav-arrows { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; transform: translateY(-50%); padding: 0 40px; pointer-events: none; z-index: 1003; }
    .modal-arrow-btn { pointer-events: auto; background: rgba(255, 255, 255, 0.15); color: #fff; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .modal-arrow-btn:hover { background: rgba(255, 255, 255, 0.3); color: var(--gold); transform: scale(1.05); }

    @media (max-width: 900px) {
      .nav-dots { grid-template-columns: repeat(9, 1fr); }
      .slider { height: 60vh; min-height: 400px; }
      .modal-arrow-btn { width: 45px; height: 45px; font-size: 24px; }
      .modal-nav-arrows { padding: 0 15px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-name">HE Global Ascent</div>
      <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>
  </header>

  <main>
    <section class="page-header container">
      <h1 class="page-title">Hair Extensions Catalog</h1>
      <p class="page-desc">Explore our premium selection of hair extensions, wigs, braiding hair, and beauty-related hair products for international markets.</p>
    </section>

    <div class="slider-container">
      <div class="slider" id="slider"></div>
      <div class="nav-arrows">
        <button class="arrow-btn" onclick="changeSlide(-1)" aria-label="Previous">❮</button>
        <button class="arrow-btn" onclick="changeSlide(1)" aria-label="Next">❯</button>
      </div>
    </div>

    <div class="nav-dots" id="nav-dots"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> HE Global Ascent. All rights reserved.</p>
    </div>
  </footer>

  <!-- 모달 구조 안에 이동 버튼 추가 -->
  <div id="imageModal" class="modal">
    <button class="close-btn" id="closeModal">&times;</button>
    <div class="modal-nav-arrows">
      <button class="modal-arrow-btn" onclick="changeModalSlide(-1)" aria-label="Previous Option">❮</button>
      <button class="modal-arrow-btn" onclick="changeModalSlide(1)" aria-label="Next Option">❯</button>
    </div>
    <img class="modal-content" id="popupImage" src="" alt="Popup Image">
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const totalPages = 36;
    const slider = document.getElementById('slider');
    const dotsContainer = document.getElementById('nav-dots');
    let currentIndex = 1;

    const modal = document.getElementById('imageModal');
    const popupImage = document.getElementById('popupImage');
    const closeModal = document.getElementById('closeModal');

    function initSlider() {
      for (let i = 1; i <= totalPages; i++) {
        const img = document.createElement('img');
        img.src = `hair_images/p${i}.jpg`;
        img.className = 'slide';
        img.id = `slide-${i}`;
        img.alt = `Hair Catalog Page ${i}`;
        img.onerror = function() { this.src = `https://via.placeholder.com/1000x800?text=Page+${i}+Missing`; };
        
        img.onclick = function() { openModal(this.src); };

        if (i === 1) img.classList.add('active');
        slider.appendChild(img);

        const btn = document.createElement('button');
        btn.className = 'dot-btn';
        if (i === 1) btn.classList.add('active');
        btn.textContent = i;
        btn.onclick = () => goToSlide(i);
        dotsContainer.appendChild(btn);
      }
    }

    function goToSlide(index) {
      document.querySelectorAll('.slide').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.dot-btn').forEach(el => el.classList.remove('active'));
      const targetSlide = document.getElementById(`slide-${index}`);
      if (targetSlide) targetSlide.classList.add('active');
      dotsContainer.children[index - 1].classList.add('active');
      currentIndex = index;
    }

    function changeSlide(direction) {
      let newIndex = currentIndex + direction;
      if (newIndex > totalPages) newIndex = 1;
      if (newIndex < 1) newIndex = totalPages;
      goToSlide(newIndex);
    }

    // 팝업 이미지 업데이트 함수
    function updateModalImage() {
      popupImage.src = `hair_images/p${currentIndex}.jpg`;
    }

    // 모달 안에서 이전/다음 버튼 클릭 시 작동하는 함수
    function changeModalSlide(direction) {
      changeSlide(direction);
      updateModalImage();
    }

    function openModal(imageSrc) {
      popupImage.src = imageSrc;
      modal.classList.add('show');
    }

    function closePopup() {
      modal.classList.remove('show');
    }

    closeModal.onclick = closePopup;
    modal.onclick = (e) => { if (e.target === modal) closePopup(); };

    initSlider();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        changeSlide(-1);
        if (modal.classList.contains('show')) updateModalImage();
      }
      if (e.key === 'ArrowRight') {
        changeSlide(1);
        if (modal.classList.contains('show')) updateModalImage();
      }
      if (e.key === 'Escape') closePopup();
    });
  </script>
</body>
</html>
