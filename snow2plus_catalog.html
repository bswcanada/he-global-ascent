<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow2Plus Catalog | HE Global Ascent</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --text: #1c1917;
      --dark: #181512;
      --line: #e7dfd5;
      --gold: #c9a66b;
      --muted: #6b625b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
    
    a { color: inherit; text-decoration: none; }
    .container { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    
    .site-header { background: rgba(247, 244, 239, 0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding: 16px 0; position: sticky; top: 0; z-index: 20; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    .brand-name { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 16px; }
    .back-link { font-size: 14px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .back-link:hover { color: var(--dark); }

    .page-header { padding: 60px 0 40px; text-align: center; }
    .page-title { font-size: clamp(32px, 5vw, 48px); letter-spacing: -0.04em; margin-bottom: 16px; }
    .page-desc { color: var(--muted); font-size: 16px; max-width: 600px; margin: 0 auto; }
    
    .slider-container { max-width: 1400px; margin: 0 auto; position: relative; }
    .slider { 
      position: relative; 
      width: 100%; 
      height: 85vh; 
      min-height: 800px; 
      background: #fff; 
      border: 1px solid var(--line); 
      border-radius: 16px; 
      overflow: hidden; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 18px 45px rgba(28, 25, 23, 0.05); 
    }
    
    .slide { display: none; max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
    .slide.active { display: block; animation: fade 0.4s ease-in-out; }
    @keyframes fade { from { opacity: 0.3; } to { opacity: 1; } }

    .nav-arrows { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; transform: translateY(-50%); padding: 0 15px; pointer-events: none; }
    .arrow-btn { pointer-events: auto; background: var(--dark); color: #fff; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; opacity: 0.6; }
    .arrow-btn:hover { opacity: 1; transform: scale(1.1); }

    .nav-dots { 
      display: flex; 
      justify-content: center; 
      gap: 15px; 
      margin-top: 30px;
      max-width: 1400px; 
      margin-left: auto; 
      margin-right: auto; 
    }
    
    .dot-btn { 
      background: none; 
      border: none; 
      color: var(--muted); 
      cursor: pointer; 
      font-size: 18px; 
      font-weight: 500; 
      padding: 5px 10px;
      transition: 0.2s;
      position: relative;
    }
    
    .dot-btn.active { 
      color: var(--dark); 
      font-weight: 800; 
      transform: scale(1.2);
    }
    .dot-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--gold);
    }
    .dot-btn:hover:not(.active) { color: var(--gold); }



    /* Product gallery shown below the catalog slider */
    .product-gallery-section {
      max-width: 1120px;
      margin: 42px auto 70px;
      padding: 0 20px;
    }

    .product-gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 22px;
      border-top: 1px solid var(--line);
      padding-top: 32px;
    }

    .product-gallery-title {
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: -0.03em;
      color: var(--dark);
    }

    .product-gallery-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 430px;
      text-align: right;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .product-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(28, 25, 23, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px rgba(28, 25, 23, 0.08);
    }

    .product-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #fff;
      padding: 14px 14px 8px;
    }

    .product-name {
      min-height: 52px;
      padding: 0 16px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--dark);
      text-transform: uppercase;
      word-break: keep-all;
    }

    @media (max-width: 900px) {
      .product-gallery-header {
        display: block;
      }

      .product-gallery-desc {
        text-align: left;
        margin-top: 10px;
      }

      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
    }

    @media (max-width: 560px) {
      .product-grid {
        grid-template-columns: 1fr;
      }

      .product-gallery-section {
        margin-top: 32px;
      }
    }

    .footer { padding: 40px 0; text-align: center; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

    /* 모달(팝업) 스타일 및 화살표 버튼 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal.show { display: flex; opacity: 1; }
    .modal-content { max-width: 85vw; max-height: 85vh; object-fit: contain; border-radius: 8px; transform: scale(0.95); transition: transform 0.3s ease; z-index: 1001; }
    .modal.show .modal-content { transform: scale(1); }
    
    .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: none; border: none; z-index: 1005; }
    .close-btn:hover { color: var(--gold); }

    /* 모달 전용 이동 화살표 */
    .modal-nav-arrows { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; transform: translateY(-50%); padding: 0 40px; pointer-events: none; z-index: 1003; }
    .modal-arrow-btn { pointer-events: auto; background: rgba(255, 255, 255, 0.15); color: #fff; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .modal-arrow-btn:hover { background: rgba(255, 255, 255, 0.3); color: var(--gold); transform: scale(1.05); }

    @media (max-width: 900px) {
      .slider { height: 60vh; min-height: 400px; }
      .modal-arrow-btn { width: 45px; height: 45px; font-size: 24px; }
      .modal-nav-arrows { padding: 0 15px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-name">HE Global Ascent</div>
      <a href="index.html" class="back-link">
        &larr; Back to Home
      </a>
    </div>
  </header>

  <main>
    <section class="page-header container">
      <h1 class="page-title">Snow2Plus Catalog</h1>
      <p class="page-desc">Leading Korean skincare and innovative cosmetics curated for global beauty markets. Discover our Snow2Plus collection.</p>
    </section>

    <div class="slider-container">
      <div class="slider" id="slider">
      </div>
      
      <div class="nav-arrows">
        <button class="arrow-btn" onclick="changeSlide(-1)" aria-label="Previous">❮</button>
        <button class="arrow-btn" onclick="changeSlide(1)" aria-label="Next">❯</button>
      </div>
    </div>

    <div class="nav-dots" id="nav-dots">
    </div>

    <section class="product-gallery-section">
      <div class="product-gallery-header">
        <h2 class="product-gallery-title">Product Images</h2>
       
      </div>
      <div class="product-grid" id="product-grid" aria-label="Snow2Plus product image gallery"></div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> HE Global Ascent. All rights reserved.</p>
    </div>
  </footer>

  <!-- 모달 구조 안에 이동 버튼 추가 -->
  <div id="imageModal" class="modal">
    <button class="close-btn" id="closeModal">&times;</button>
    <div class="modal-nav-arrows">
      <button class="modal-arrow-btn" onclick="changeModalSlide(-1)" aria-label="Previous Option">❮</button>
      <button class="modal-arrow-btn" onclick="changeModalSlide(1)" aria-label="Next Option">❯</button>
    </div>
    <img class="modal-content" id="popupImage" src="" alt="Popup Image">
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const totalPages = 6;
    const slider = document.getElementById('slider');
    const dotsContainer = document.getElementById('nav-dots');
    let currentIndex = 1;

    const modal = document.getElementById('imageModal');
    const popupImage = document.getElementById('popupImage');
    const closeModal = document.getElementById('closeModal');

    const productGrid = document.getElementById('product-grid');
    const productFiles = [
      '1_Melasma_Care_Set.png',
      '2_Boostok_Eco_Hair.jpg',
      '3_boostok.jpg',
      '4_ac_magnesium_patch(mini).jpg',
      '5_ac_magnesium_patch(small).jpg',
      '6_ac_magnesium_patch(medium).jpg',
      '7_ac_magnesium_patch(large).jpg',
      '8_Handy_ToK_Clear_Patch(45EA).jpg',
      '9_Handy_ToK_Clear_Patch(120EA).jpg',
      '10_One_Night_Trouble_Patch_Plus.jpg',
      '11_One_Night_Trouble_Patch_Plus(Value Pack).jpg',
      '12_Handy_Tok!_Point_Patch.jpg',
      '13_Tiger_Blemish_Patch_8ea.jpg',
      '14_Tiger_Blemish_Patch_16ea.jpg',
      '15_Tiger_Blemish_Patch_Medium.jpg',
      '16_MAGSIUM_Wrinkle_Repair_Patch & Mask.jpg'
    ];

    function formatProductName(fileName) {
      return fileName
        .replace(/^[0-9]+_/, '')
        .replace(/\.[^.]+$/, '')
        .replace(/_/g, ' ')
        .replace(/\(/g, ' (')
        .replace(/\s+/g, ' ')
        .trim()
        .toUpperCase();
    }

    function initProductGallery() {
      productFiles.forEach((fileName) => {
        const card = document.createElement('div');
        card.className = 'product-card';

        const productName = formatProductName(fileName);

        const img = document.createElement('img');
        img.src = `snow2plus/${encodeURIComponent(fileName)}`;
        img.alt = productName;
        img.loading = 'lazy';
        img.onerror = function() {
          card.classList.add('is-missing');
          this.alt = `Missing image: snow2plus/${fileName}`;
        };

        const name = document.createElement('p');
        name.className = 'product-name';
        name.textContent = productName;

        card.appendChild(img);
        card.appendChild(name);
        productGrid.appendChild(card);
      });
    }


    function initSlider() {
      for (let i = 1; i <= totalPages; i++) {
        const img = document.createElement('img');
        img.src = `snow2plus/p${i}.jpg`;
        img.className = 'slide';
        img.id = `slide-${i}`;
        img.alt = `Snow2Plus Catalog Page ${i}`;
        img.onerror = function() { this.src = `https://via.placeholder.com/1000x800?text=Page+${i}+Missing`; };
        
        img.onclick = function() { openModal(this.src); };

        if (i === 1) img.classList.add('active');
        slider.appendChild(img);

        const btn = document.createElement('button');
        btn.className = 'dot-btn';
        if (i === 1) btn.classList.add('active');
        btn.textContent = i;
        btn.onclick = () => goToSlide(i);
        dotsContainer.appendChild(btn);
      }
    }

    function goToSlide(index) {
      document.querySelectorAll('.slide').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.dot-btn').forEach(el => el.classList.remove('active'));
      
      const targetSlide = document.getElementById(`slide-${index}`);
      if (targetSlide) targetSlide.classList.add('active');
      dotsContainer.children[index - 1].classList.add('active');
      currentIndex = index;
    }

    function changeSlide(direction) {
      let newIndex = currentIndex + direction;
      if (newIndex > totalPages) newIndex = 1;
      if (newIndex < 1) newIndex = totalPages;
      goToSlide(newIndex);
    }

    // 팝업 이미지 업데이트 함수
    function updateModalImage() {
      popupImage.src = `snow2plus/p${currentIndex}.jpg`;
    }

    // 모달 안에서 이전/다음 버튼 클릭 시 작동하는 함수
    function changeModalSlide(direction) {
      changeSlide(direction);
      updateModalImage();
    }

    function openModal(imageSrc) {
      popupImage.src = imageSrc;
      modal.classList.add('show');
    }

    function closePopup() {
      modal.classList.remove('show');
    }

    closeModal.onclick = closePopup;
    modal.onclick = (e) => { if (e.target === modal) closePopup(); };

    initSlider();
    initProductGallery();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        changeSlide(-1);
        if (modal.classList.contains('show')) updateModalImage();
      }
      if (e.key === 'ArrowRight') {
        changeSlide(1);
        if (modal.classList.contains('show')) updateModalImage();
      }
      if (e.key === 'Escape') closePopup();
    });
  </script>
</body>
</html>
